<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIEURO - Cadastro de Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para ajustar detalhes específicos da imagem */
        .input-field {
            background-color: #EBF1FA; /* Azulzinho claro dos inputs */
        }
        .header-blue {
            background-color: #003366; /* Azul escuro do cabeçalho */
        }
        .btn-blue {
            background-color: #1E88E5; /* Azul do botão de ação */
        }
        .btn-blue:hover {
            background-color: #1565C0;
        }
        /* Classe para esconder formulários inativos */
        .hidden-form {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-500 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-5xl shadow-2xl overflow-hidden relative min-h-[800px]">
        
        <header class="bg-white p-4 flex justify-between items-center border-b border-gray-200">
            <div class="flex items-center gap-2">
                <div class="flex items-center">
                   <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Logo_UNIEURO.png/800px-Logo_UNIEURO.png" alt="Logo UNIEURO" class="h-10 object-contain">
                </div>
            </div>
            <span class="text-blue-900 font-bold text-sm uppercase">Clínica Psicológica</span>
        </header>

        <div class="header-blue text-white text-center py-2 font-bold text-lg uppercase">
            Cadastro de Usuário
        </div>

        <main class="p-8">
            
            <h2 class="text-center text-xl font-bold text-gray-800 mb-6">Selecione um perfil para o Usuário:</h2>

            <div class="flex flex-wrap justify-center gap-4 mb-8">
                <button onclick="switchTab('estagiario')" id="tab-estagiario" class="tab-btn px-6 py-2 rounded shadow bg-gray-200 text-gray-700 hover:bg-gray-300 transition font-semibold text-sm">Estagiário</button>
                <button onclick="switchTab('supervisor')" id="tab-supervisor" class="tab-btn px-6 py-2 rounded shadow bg-gray-200 text-gray-700 hover:bg-gray-300 transition font-semibold text-sm">Supervisor</button>
                <button onclick="switchTab('coordenador')" id="tab-coordenador" class="tab-btn px-6 py-2 rounded shadow bg-blue-900 text-white transition font-semibold text-sm">Coordenador</button>
                <button onclick="switchTab('resp_tecnica')" id="tab-resp_tecnica" class="tab-btn px-6 py-2 rounded shadow bg-gray-200 text-gray-700 hover:bg-gray-300 transition font-semibold text-sm">Resp. Técnica</button>
                <button onclick="switchTab('secretaria')" id="tab-secretaria" class="tab-btn px-6 py-2 rounded shadow bg-gray-200 text-gray-700 hover:bg-gray-300 transition font-semibold text-sm">Secretária</button>
            </div>

            <hr class="border-gray-300 mb-6">

            <h3 id="profile-title" class="text-xl font-bold text-gray-800 mb-2 border-b-2 border-gray-400 pb-1 w-full max-w-xs">Coordenador</h3>

            <form class="space-y-4 max-w-4xl mx-auto mt-6">
                
                <div>
                    <label class="block text-gray-800 font-semibold mb-1 text-sm">Nome Completo</label>
                    <input type="text" placeholder="Digite o nome aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-gray-800 font-semibold mb-1 text-sm">E-mail Institucional</label>
                    <input type="email" placeholder="Digite o e-mail aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div id="form-padrao" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">CRP</label>
                        <input type="text" placeholder="Digite o CRP aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">CPF</label>
                        <input type="text" placeholder="Digite o CPF aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div id="form-estagiario" class="hidden-form grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">CRP do Supervisor</label>
                        <input type="text" placeholder="Digite o CRP aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">RA</label>
                        <input type="text" placeholder="Digite o RA do Aluno aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div id="form-secretaria" class="hidden-form grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">Código Funcionário</label>
                        <input type="text" placeholder="Digite o Código aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">CPF</label>
                        <input type="text" placeholder="Digite o CPF aqui" class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-800 font-semibold mb-1 text-sm">Senha</label>
                    <input type="password" placeholder="Digite uma senha provisória aqui..." class="input-field w-full p-3 rounded border border-gray-300 text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div id="extra-estagiario" class="hidden-form grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">Nível do Estagiário</label>
                        <div class="relative">
                            <select class="input-field w-full p-3 rounded border border-gray-300 text-sm appearance-none focus:outline-none text-gray-500">
                                <option>Selecione o nível aqui</option>
                                <option>Nível 1</option>
                                <option>Nível 2</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-800 font-semibold mb-1 text-sm">Semestre do Aluno</label>
                        <div class="relative">
                            <select class="input-field w-full p-3 rounded border border-gray-300 text-sm appearance-none focus:outline-none text-gray-500">
                                <option>Selecione o semestre aqui</option>
                                <option>5º Semestre</option>
                                <option>6º Semestre</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-center mt-10">
                    <button type="button" class="btn-blue text-white font-bold py-3 px-12 rounded w-full md:w-1/2 shadow-lg transition transform hover:scale-105">
                        Cadastrar Usuário
                    </button>
                </div>

            </form>
            
            <div class="mt-12 text-center text-xs text-gray-500 font-semibold">
                © 2023 Clínica de Psicologia. Todos os direitos reservados.
            </div>

        </main>
    </div>

    <script>
        function switchTab(profile) {
            // 1. Atualizar Título
            const titles = {
                'estagiario': 'Estagiário',
                'supervisor': 'Supervisor',
                'coordenador': 'Coordenador',
                'resp_tecnica': 'Responsável Técnico',
                'secretaria': 'Secretária'
            };
            document.getElementById('profile-title').innerText = titles[profile];

            // 2. Gerenciar Botões (Estilos)
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                // Resetar estilo padrão
                btn.className = "tab-btn px-6 py-2 rounded shadow bg-gray-200 text-gray-700 hover:bg-gray-300 transition font-semibold text-sm";
            });
            // Ativar botão clicado
            const activeBtn = document.getElementById(`tab-${profile}`);
            activeBtn.className = "tab-btn px-6 py-2 rounded shadow bg-blue-900 text-white transition font-semibold text-sm";

            // 3. Gerenciar Campos do Formulário
            const formPadrao = document.getElementById('form-padrao');
            const formEstagiario = document.getElementById('form-estagiario');
            const formSecretaria = document.getElementById('form-secretaria');
            const extraEstagiario = document.getElementById('extra-estagiario');

            // Resetar visibilidade
            formPadrao.classList.add('hidden-form');
            formEstagiario.classList.add('hidden-form');
            formSecretaria.classList.add('hidden-form');
            extraEstagiario.classList.add('hidden-form');

            // Logica de exibição baseada no perfil
            if (profile === 'coordenador' || profile === 'supervisor' || profile === 'resp_tecnica') {
                formPadrao.classList.remove('hidden-form');
            } else if (profile === 'estagiario') {
                formEstagiario.classList.remove('hidden-form');
                extraEstagiario.classList.remove('hidden-form');
            } else if (profile === 'secretaria') {
                formSecretaria.classList.remove('hidden-form');
            }
        }

        // Inicializar com Coordenador selecionado (como na primeira imagem)
        switchTab('coordenador');
    </script>
</body>
</html>
